[project]
name = "beetle-keeper-database"
version = "1.0.0"
description = "PostgreSQL schema, migrations and migration runner for Beetle Keeper"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
