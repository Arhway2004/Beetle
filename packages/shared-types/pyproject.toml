[project]
name = "beetle-shared-types"
version = "1.0.0"
description = "Python models and validators generated from packages/api-contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/beetle_shared_types"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["python/beetle_shared_types/ai_suggestion_v1.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
