[project]
name = "beetle-api"
version = "1.0.0"
description = "Beetle Keeper backend: validation, business rules and server-side persistence (PostgreSQL)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "beetle-shared-types",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27", "pyyaml>=6"]

[tool.uv.sources]
beetle-shared-types = { path = "../../packages/shared-types", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beetle_api"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
