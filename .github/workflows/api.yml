name: api
on:
  push:
    branches: [main]
    paths: ["services/api/**", "database/**", "packages/shared-types/**", "packages/api-contracts/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["services/api/**", "database/**", "packages/shared-types/**", "packages/api-contracts/**", ".github/workflows/api.yml"]
concurrency: { group: "api-${{ github.ref }}", cancel-in-progress: true }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --python 3.13 --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile -t beetle-api:ci .
