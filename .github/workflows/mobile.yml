name: mobile
on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", "packages/api-contracts/fixtures/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["apps/mobile/**", "packages/api-contracts/fixtures/**", ".github/workflows/mobile.yml"]
concurrency: { group: "mobile-${{ github.ref }}", cancel-in-progress: true }
defaults:
  run:
    working-directory: apps/mobile
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.29.0", channel: stable, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          flutter gen-l10n
          git diff --exit-code -- lib/
      - run: flutter analyze
      - run: flutter test
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.29.0", channel: stable, cache: true }
      - run: flutter pub get
      # Without android/key.properties the release APK is debug-signed (not for distribution).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: app-release-apk, path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk }
  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.29.0", channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
